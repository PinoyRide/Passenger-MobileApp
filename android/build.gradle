// Top-level build file where you can add configuration options common to all sub-projects/modules.
// SDK levels (compile/target 36, min 24), NDK and build tools come from the expo-root-project plugin (Expo SDK 54).

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    classpath('com.google.gms:google-services:4.4.2')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
  configurations.all {
    resolutionStrategy {
      // react-native-geolocation-service is built against the play-services-location 21 API
      force 'com.google.android.gms:play-services-location:21.0.1'
      force 'androidx.browser:browser:1.8.0'
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

// The React Native Gradle plugin adds the oss.sonatype.org snapshots repo to every subproject. It is slow
// and flaky; a 504 there cascades into unrelated resolution failures, so it is removed after configuration.
gradle.projectsEvaluated {
  allprojects {
    repositories.removeAll { repo ->
      repo instanceof MavenArtifactRepository &&
        repo.url.toString().contains("oss.sonatype.org")
    }
  }
}
