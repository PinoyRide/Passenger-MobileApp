# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx4608m -XX:MaxMetaspaceSize=512m

# AndroidX package structure
android.useAndroidX=true
android.enableJetifier=true

# Enable AAPT2 PNG crunching
android.enablePngCrunchInReleaseBuilds=true

# Architectures to build. Google Play requires 64-bit (arm64-v8a, x86_64).
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# The app still runs on the legacy architecture: react-native-geolocation-service,
# react-native-network-info and react-native-simple-crypto are not New Architecture ready.
# Expo SDK 54 is the last SDK that allows this.
newArchEnabled=false

# Use the Hermes JS engine.
hermesEnabled=true

# Android 15+ draws apps edge to edge and Android 16 (target 36) removes the opt-out.
# Screens handle insets through react-native-safe-area-context.
edgeToEdgeEnabled=true

# Enable GIF support in React Native images (~200 B increase)
expo.gif.enabled=true
# Enable webp support in React Native images (~85 KB increase)
expo.webp.enabled=true
# Animated webp is off because iOS doesn't support it
expo.webp.animated=false

# Enable network inspector
EX_DEV_CLIENT_NETWORK_INSPECTOR=true

# Keep native libraries uncompressed and page-aligned in the APK/AAB, as Google Play's
# 16 KB page size requirement needs.
expo.useLegacyPackaging=false

MYAPP_VERSION_NAME=2.0.83

android.extraMavenRepos=[]
